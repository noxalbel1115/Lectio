<rect x="0.5" y="0.5" width="599" height="439" rx="12" class="bg"/>
<text x="24.0" y="36.0" class="ink" font-size="18" text-anchor="start" font-weight="600" >Os títulos nem sempre protegem as ações</text>
<text x="24.0" y="60.0" class="ink2" font-size="14" text-anchor="start" font-weight="400" >Sinal da correlação entre os retornos de ações e de títulos do governo</text>

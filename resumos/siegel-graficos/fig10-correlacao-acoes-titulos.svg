<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-labelledby="tt dd" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="tt">Os títulos nem sempre protegem as ações</title><desc id="dd">1926–1965: levemente positiva; Grande Depressão: negativa; 1960–1990: positiva; depois de 1998: negativa.</desc>

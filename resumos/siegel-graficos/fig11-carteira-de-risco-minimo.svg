<title id="tt">A carteira de menor risco muda com o prazo</title><desc id="dd">1 e 2 anos: quase nada em ações; 5 anos: 25%; 10 anos: mais de um terço; 20 anos: mais de metade; 30 anos: mais de 60%.</desc>

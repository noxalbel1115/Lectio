<text x="24.0" y="36.0" class="ink" font-size="18" text-anchor="start" font-weight="600" >A carteira de menor risco muda com o prazo</text>
<text x="24.0" y="60.0" class="ink2" font-size="14" text-anchor="start" font-weight="400" >Parcela em ações na carteira que minimiza o risco, por horizonte</text>

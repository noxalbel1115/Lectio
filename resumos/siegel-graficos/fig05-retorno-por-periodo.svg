<text x="24.0" y="36.0" class="ink" font-size="18" text-anchor="start" font-weight="600" >Retorno real das ações americanas, por período</text>
<text x="24.0" y="60.0" class="ink2" font-size="14" text-anchor="start" font-weight="400" >Média anual acima da inflação. Média de todo o período: cerca de 6,6%</text>

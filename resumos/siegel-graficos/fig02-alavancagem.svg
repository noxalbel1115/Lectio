<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="tt dd" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="tt">Uma queda de 3% nos ativos, conforme a alavancagem</title><desc id="dd">Com queda de 3% nos ativos, o patrimônio cai 3% sem dívida, 30% a 10:1, 60% a 20:1 e 90% a 30:1.</desc>
<style>
.bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}
.grid{stroke:#e1e0d9;stroke-width:1}.axis{stroke:#c3c2b7;stroke-width:1}
.ref{stroke:#52514e;stroke-width:1}
.s1{fill:#2a78d6}.s1s{stroke:#2a78d6}.s1w{fill:#2a78d6;fill-opacity:.10}
.s2{fill:#eb6834}.s2s{stroke:#eb6834}.s2w{fill:#eb6834;fill-opacity:.10}
.s3{fill:#1baf7a}
.gray{fill:#c3c2b7}.grays{stroke:#c3c2b7}
.neg{fill:#2a78d6}.pos{fill:#e34948}.posl{fill:#e34948;fill-opacity:.40}
.ring{stroke:#fcfcfb}.surf{fill:#fcfcfb}
.onfill{fill:#ffffff}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.mut{fill:#898781}
.grid{stroke:#2c2c2a}.axis{stroke:#383835}
.ref{stroke:#c3c2b7}
.s1{fill:#3987e5}.s1s{stroke:#3987e5}.s1w{fill:#3987e5;fill-opacity:.14}
.s2{fill:#d95926}.s2s{stroke:#d95926}.s2w{fill:#d95926;fill-opacity:.14}
.s3{fill:#199e70}
.gray{fill:#52514e}.grays{stroke:#52514e}
.neg{fill:#3987e5}.pos{fill:#e66767}.posl{fill:#e66767;fill-opacity:.45}
.ring{stroke:#1a1a19}.surf{fill:#1a1a19}
}
</style>
<rect x="0.5" y="0.5" width="599" height="419" rx="12" class="bg"/>
<text x="24.0" y="36.0" class="ink" font-size="18" text-anchor="start" font-weight="600" >Uma queda de 3% nos ativos, conforme a alavancagem</text>
<text x="24.0" y="60.0" class="ink2" font-size="14" text-anchor="start" font-weight="400" >Perda de patrimônio próprio para cada relação entre ativos e capital próprio</text>
<line x1="92.0" y1="120.0" x2="560.0" y2="120.0" class="axis" />
<text x="82.0" y="124.0" class="mut" font-size="13" text-anchor="end" font-weight="400" >0%</text>
<line x1="92.0" y1="172.5" x2="560.0" y2="172.5" class="grid" />
<text x="82.0" y="176.5" class="mut" font-size="13" text-anchor="end" font-weight="400" >−25%</text>
<line x1="92.0" y1="225.0" x2="560.0" y2="225.0" class="grid" />
<text x="82.0" y="229.0" class="mut" font-size="13" text-anchor="end" font-weight="400" >−50%</text>
<line x1="92.0" y1="277.5" x2="560.0" y2="277.5" class="grid" />
<text x="82.0" y="281.5" class="mut" font-size="13" text-anchor="end" font-weight="400" >−75%</text>
<line x1="92.0" y1="330.0" x2="560.0" y2="330.0" class="grid" />
<text x="82.0" y="334.0" class="mut" font-size="13" text-anchor="end" font-weight="400" >−100%</text>
<text x="150.5" y="94.0" class="ink" font-size="14" text-anchor="middle" font-weight="600" >Sem dívida</text>
<text x="150.5" y="111.0" class="mut" font-size="12" text-anchor="middle" font-weight="400" >1 : 1</text>
<path d="M138.5,120.0 L138.5,123.2 Q138.5,126.3 141.7,126.3 L159.3,126.3 Q162.5,126.3 162.5,123.2 L162.5,120.0 Z" class="s1"/>
<text x="150.5" y="146.3" class="ink" font-size="15" text-anchor="middle" font-weight="600" >−3%</text>
<text x="267.5" y="94.0" class="ink" font-size="14" text-anchor="middle" font-weight="600" >10 : 1</text>
<path d="M255.5,120.0 L255.5,179.0 Q255.5,183.0 259.5,183.0 L275.5,183.0 Q279.5,183.0 279.5,179.0 L279.5,120.0 Z" class="s1"/>
<text x="267.5" y="203.0" class="ink" font-size="15" text-anchor="middle" font-weight="600" >−30%</text>
<text x="384.5" y="94.0" class="ink" font-size="14" text-anchor="middle" font-weight="600" >20 : 1</text>
<path d="M372.5,120.0 L372.5,242.0 Q372.5,246.0 376.5,246.0 L392.5,246.0 Q396.5,246.0 396.5,242.0 L396.5,120.0 Z" class="s1"/>
<text x="384.5" y="266.0" class="ink" font-size="15" text-anchor="middle" font-weight="600" >−60%</text>
<text x="501.5" y="94.0" class="ink" font-size="14" text-anchor="middle" font-weight="600" >30 : 1</text>
<path d="M489.5,120.0 L489.5,305.0 Q489.5,309.0 493.5,309.0 L509.5,309.0 Q513.5,309.0 513.5,305.0 L513.5,120.0 Z" class="s1"/>
<text x="501.5" y="329.0" class="ink" font-size="15" text-anchor="middle" font-weight="600" >−90%</text>
<text x="24.0" y="382.0" class="ink2" font-size="14" text-anchor="start" font-weight="400" >A 30 : 1, basta uma queda de 3,3% nos ativos para zerar o patrimônio.</text>
<text x="24.0" y="402.0" class="mut" font-size="12" text-anchor="start" font-weight="400" >Cálculo ilustrativo: perda do patrimônio = queda dos ativos × alavancagem.</text>
</svg>